<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroYou IPTV | Premium Apps</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --dark-bg: #050810; --card-bg: #111827; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark-bg); color: white; margin: 0; text-align: center; }
        
        .container { padding: 60px 5%; }
        h2 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; margin-bottom: 40px; }

        /* Grid dyal les Apps */
        .apps-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 20px; 
        }
        .app-card { 
            background: var(--card-bg); 
            padding: 25px 15px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
            cursor: pointer;
        }
        .app-card:hover { 
            border-color: var(--primary); 
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.1);
        }
        .app-card img { 
            width: 80px; 
            height: 80px; 
            object-fit: contain; 
            border-radius: 15px; 
            margin-bottom: 15px;
            background: #000;
        }
        .app-card p { font-weight: bold; font-size: 0.9rem; margin: 0; color: #cbd5e1; }
        
        .btn-wa { 
            background: #25d366; color: white; padding: 15px 30px; 
            border-radius: 50px; text-decoration: none; display: inline-block; 
            margin-top: 40px; font-weight: bold;
        }
    </style>
</head>
<body>

<section class="container">
    <h2>التطبيقات المدعومة</h2>
    <p class="subtitle">نحن ندعم جميع المشغلات العالمية لضمان أفضل تجربة</p>

    <div class="apps-grid">
        <!-- Smart X -->
        <div class="app-card">
            <img src="1000141735.jpg" alt="Smart X">
            <p>Smart X</p>
        </div>

        <!-- IBO Player -->
        <div class="app-card">
            <img src="1000141737.jpg" alt="IBO Player">
            <p>IBO Player</p>
        </div>

        <!-- Hot Player -->
        <div class="app-card">
            <img src="1000141739.jpg" alt="Hot Player">
            <p>Hot Player</p>
        </div>

        <!-- IBO Player Pro -->
        <div class="app-card">
            <img src="1000141741.jpg" alt="IBO Player Pro">
            <p>IBO Pro</p>
        </div>

        <!-- IPTV Smarters -->
        <div class="app-card">
            <img src="téléchargement3.jpg" alt="Smarters Pro">
            <p>Smarters Pro</p>
        </div>

        <!-- Bob Player -->
        <div class="app-card">
            <img src="téléchargement4.jpg" alt="Bob Player">
            <p>Bob Player</p>
        </div>
    </div>

    <a href="https://wa.me/212626869960" class="btn-wa">
        <i class="fab fa-whatsapp"></i> اطلب تجربة مجانية الآن
    </a>
</section>

</body>
</html>
