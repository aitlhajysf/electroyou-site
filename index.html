<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroYou IPTV | Premium Apps</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --dark: #050810; --card: #111827; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--dark); color: white; margin: 0; padding: 0; }
        
        .container { max-width: 1100px; margin: auto; padding: 60px 20px; text-align: center; }
        
        /* Grid dyal les apps fhal b4458152-5128-4cde-8eef-8f21057d57bc */
        .apps-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 20px; 
            margin-top: 40px; 
        }
        
        .app-item { 
            background: var(--card); 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        
        .app-item:hover { border-color: var(--primary); transform: translateY(-5px); }
        
        .app-item img { 
            width: 80px; 
            height: 80px; 
            object-fit: contain; 
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .section-title { font-size: 2rem; margin-bottom: 10px; }
        .section-subtitle { color: #94a3b8; margin-bottom: 40px; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="section-title">التطبيقات المدعومة</h2>
    <p class="section-subtitle">شغل إشتراكك على تطبيقك المفضل في جميع الأجهزة</p>

    <div class="apps-grid">
        <!-- App 1: SmartX nichan men b4458152-5128-4cde-8eef-8f21057d57bc -->
        <div class="app-item">
            <img src="téléchargement.jpg" alt="SmartX">
            <p>SmartX</p>
        </div>

        <!-- App 2: IBO Player -->
        <div class="app-item">
            <img src="téléchargement6.jpg" alt="IBO Player">
            <p>IBO Player</p>
        </div>

        <!-- App 3: Bob Player / Player Pro -->
        <div class="app-item">
            <img src="téléchargement1.jpg" alt="IPTV App">
            <p>Player 1</p>
        </div>

        <!-- App 4: Smarters Pro -->
        <div class="app-item">
            <img src="téléchargement3.jpg" alt="Smarters Pro">
            <p>Smarters Pro</p>
        </div>

        <!-- App 5: Bob Player -->
        <div class="app-item">
            <img src="téléchargement4.jpg" alt="Bob Player">
            <p>Bob Player</p>
        </div>
    </div>
</div>

</body>
</html>
